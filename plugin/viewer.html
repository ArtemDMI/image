<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Схема локации</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #14161b;
            color: #e7ebf2;
            font: 14px/1.4 system-ui, sans-serif;
        }
        #win {
            position: fixed;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #2a2d34;
            border: 1px solid #4a5160;
            border-radius: 10px;
            box-shadow: 0 16px 40px rgb(0 0 0 / 45%);
            touch-action: none;
            overflow: visible;
        }
        #bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-height: 42px;
            padding: 0 0.8rem;
            background: #343844;
            border-radius: 10px 10px 0 0;
            cursor: grab;
            user-select: none;
        }
        #bar:active { cursor: grabbing; }
        #title { font-weight: 700; margin-right: auto; }
        #scaleLabel { min-width: 3.2rem; text-align: right; color: #c5ccda; }
        #scale {
            width: 7rem;
            cursor: pointer;
            touch-action: auto;
        }
        #stage {
            flex: 1;
            /* A flex item defaults to min-height:auto, so the picture would refuse to shrink with the window. */
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #17191e;
        }
        #stage > * { grid-area: 1 / 1; }
        #pic {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        #placeholder {
            margin: 0;
            padding: 1rem;
            text-align: center;
            color: #9aa3b2;
        }
        #status {
            min-height: 1.4em;
            margin: 0;
            padding: 0.45rem 0.8rem 0.2rem;
            color: #c5ccda;
        }
        #status.is-error { color: #ff8d8d; }
        #go {
            height: 44px;
            margin-top: 0.35rem;
            border: 0;
            border-radius: 0 0 9px 9px;
            background: #3d7eff;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        #go:disabled { opacity: 0.55; cursor: default; }
        .handle { position: absolute; z-index: 3; }
        .handle[data-edge="n"],
        .handle[data-edge="s"] { left: 12px; right: 12px; height: 10px; }
        .handle[data-edge="n"] { top: -5px; cursor: ns-resize; }
        .handle[data-edge="s"] { bottom: -5px; cursor: ns-resize; }
        .handle[data-edge="e"],
        .handle[data-edge="w"] { top: 12px; bottom: 12px; width: 10px; }
        .handle[data-edge="e"] { right: -5px; cursor: ew-resize; }
        .handle[data-edge="w"] { left: -5px; cursor: ew-resize; }
        .handle[data-edge="nw"],
        .handle[data-edge="ne"],
        .handle[data-edge="sw"],
        .handle[data-edge="se"] { width: 14px; height: 14px; }
        .handle[data-edge="nw"] { top: -6px; left: -6px; cursor: nwse-resize; }
        .handle[data-edge="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
        .handle[data-edge="ne"] { top: -6px; right: -6px; cursor: nesw-resize; }
        .handle[data-edge="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
    </style>
</head>
<body>
    <section id="win">
        <header id="bar" draggable="true" title="Перетащите окно. Колесо мыши меняет масштаб.">
            <span id="title" role="heading" aria-level="1">Схема локации</span>
            <input id="scale" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Масштаб окна">
            <span id="scaleLabel">100%</span>
        </header>
        <div id="stage">
            <p id="placeholder">Нажмите «Генерация», чтобы собрать схему текущей сцены.</p>
            <img id="pic" alt="Схема локации" hidden draggable="false">
        </div>
        <p id="status"></p>
        <button id="go" type="button">Генерация</button>
        <div class="handle" data-edge="n" draggable="true"></div>
        <div class="handle" data-edge="s" draggable="true"></div>
        <div class="handle" data-edge="e" draggable="true"></div>
        <div class="handle" data-edge="w" draggable="true"></div>
        <div class="handle" data-edge="nw" draggable="true"></div>
        <div class="handle" data-edge="ne" draggable="true"></div>
        <div class="handle" data-edge="sw" draggable="true"></div>
        <div class="handle" data-edge="se" draggable="true" role="button" aria-label="Растянуть окно"></div>
    </section>
    <script src="/viewer.js"></script>
</body>
</html>
