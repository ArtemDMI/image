<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location Map</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #14161b;
            color: #e7ebf2;
            font: 14px/1.4 system-ui, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.45rem;
            background: #2a2d34;
        }
        #go {
            height: 36px;
            padding: 0 1rem;
            border: 0;
            border-radius: 6px;
            background: #3d7eff;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        #go:disabled { opacity: 0.55; cursor: default; }
        #status {
            margin: 0;
            color: #c5ccda;
        }
        #status.is-error { color: #ff8d8d; }
        #stage {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #17191e;
        }
        #pic {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            /* The picture meets the tab edges. contain would leave empty bands. */
            object-fit: fill;
            display: block;
        }
        #placeholder {
            margin: 0;
            padding: 1rem;
            text-align: center;
            color: #9aa3b2;
        }
    </style>
</head>
<body>
    <div id="bar">
        <button id="go" type="button">Генерация</button>
        <p id="status"></p>
    </div>
    <div id="stage">
        <p id="placeholder">Нажмите «Генерация», чтобы собрать схему текущей сцены.</p>
        <img id="pic" alt="Location Map" hidden draggable="false">
    </div>
    <script src="/viewer.js"></script>
</body>
</html>
